[package]
name = "norn-kv-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
futures-util = "0.3"
norn-channel = { path = "../../norn-channel" }
norn-executor = { path = "../../norn-executor" }
smallvec = "1.11.1"
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdrhistogram = { version = "7", default-features = false }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
libc = "0.2.149"
norn-uring = { path = "../../norn-uring" }

[[bin]]
name = "norn-kv-server"
path = "src/main.rs"

[[bin]]
name = "norn-kv-loadgen"
path = "src/bin/network-loadgen.rs"

[[bin]]
name = "norn-mixed-loadgen"
path = "src/bin/mixed-loadgen.rs"
