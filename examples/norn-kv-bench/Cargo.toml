[package]
name = "norn-kv-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Mixed-workload benchmark driver for norn-kv-server"

# The client deliberately depends on no Norn crate: runtime changes under test
# must not change the load generator.
[dependencies]
hdrhistogram = { version = "7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.149"
