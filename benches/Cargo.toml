[package]
name = "benches"
version = "0.1.0"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
norn-task = { path = "../norn-task" }
norn-channel = { path = "../norn-channel" }
norn-executor = { path = "../norn-executor" }
norn-timer = { path = "../norn-timer" }
norn-util = { path = "../norn-util" }
norn-kv = { path = "../examples/norn-kv" }

[target.'cfg(target_os = "linux")'.dependencies]
norn-uring = { path = "../norn-uring" }
io-uring = "0.7.11"
libc = "0.2.149"
hyper = { version = "1", features = ["client", "server", "http2"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
pin-project-lite = "0.2.13"
prost = "0.14"
tokio = { version = "1.35.0", features = ["io-util", "net", "rt", "time"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
http-body-util = "0.1.0"

[dev-dependencies]
bencher = "0.1.5"
futures = "0.3.29"
pprof = { version = "0.15", features = ["flamegraph", "prost-codec"] }
tokio = { version = "1.35.0", features = ["rt", "time"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[[bench]]
name = "schedule_task"
path = "schedule_task.rs"
harness = false

[[bench]]
name = "noop_submit"
path = "noop_submit.rs"
harness = false

[[bench]]
name = "timers"
path = "timers.rs"
harness = false

[[bench]]
name = "hyper"
path = "hyper.rs"
harness = false

[[bench]]
name = "grpc_runtime"
path = "grpc_runtime.rs"
harness = false

[[bench]]
name = "task_state"
path = "task_state.rs"
harness = false

[[bench]]
name = "executor"
path = "executor.rs"
harness = false

[[bench]]
name = "channel"
path = "channel.rs"
harness = false

[[bench]]
name = "uring_realworld"
path = "uring_realworld.rs"
harness = false

[[bench]]
name = "io_uring_accept_recv"
path = "io_uring_accept_recv.rs"
harness = false

[[bench]]
name = "norn_kv"
path = "norn_kv.rs"
harness = false

[[bench]]
name = "fixed_buffers"
path = "fixed_buffers.rs"
harness = false

[[bench]]
name = "uring_completion_backlog"
path = "uring_completion_backlog.rs"
harness = false

[[bench]]
name = "bundle_send"
path = "bundle_send.rs"
harness = false
